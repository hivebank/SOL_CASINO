<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette - Casino</title>
    <link rel="stylesheet" href="../../public/styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a2e1a 0%, #163e16 100%);
            font-family: 'Arial', sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        .game-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 80vh;
            padding: 20px;
        }

        .game-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(30, 50, 30, 0.95);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-weight: bold;
        }

        .control-group input {
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #4a6a4a;
            background: #2a3e2a;
            color: #fff;
            font-size: 16px;
            width: 100px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary {
            background: #4a6a4a;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a7a5a;
        }
    </style>
</head>
<body>
    <script src="../../public/games/roulette.bundle.js"></script>
</body>
</html>
