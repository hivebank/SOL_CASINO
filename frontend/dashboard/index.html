<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Casino</title>
    <link rel="stylesheet" href="../lobby/index.html">
    <style>
        body {
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }

        .dashboard-header {
            background: rgba(30, 30, 50, 0.8);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            padding: 25px;
        }

        .stat-card h3 {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #ffc857;
        }

        .table-container {
            background: rgba(30, 30, 50, 0.8);
            border-radius: 15px;
            padding: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: #ffc857;
            font-weight: bold;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            background: #667eea;
            color: white;
            margin: 5px;
        }

        .btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <h1>User Dashboard</h1>
        <button onclick="window.location.href='/'" class="btn">Back to Lobby</button>
    </div>

    <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
            <h3>Demo Balance</h3>
            <div class="stat-value" id="demo-balance">0</div>
        </div>
        <div class="stat-card">
            <h3>Nugget Balance</h3>
            <div class="stat-value" id="nugget-balance">0</div>
        </div>
        <div class="stat-card">
            <h3>Total Bets</h3>
            <div class="stat-value" id="total-bets">0</div>
        </div>
        <div class="stat-card">
            <h3>Total Winnings</h3>
            <div class="stat-value" id="total-winnings">0</div>
        </div>
    </div>

    <div class="table-container">
        <h2>Bet History</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Game</th>
                    <th>Stake</th>
                    <th>Payout</th>
                    <th>Multiplier</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="bet-history">
                <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="table-container" style="margin-top: 30px;">
        <h2>Nugget Transaction History</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Reason</th>
                </tr>
            </thead>
            <tbody id="nugget-history">
                <tr><td colspan="4" style="text-align: center;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { api } from '../common/api.js';
        import { UIHelper } from '../common/ui.js';

        async function loadDashboard() {
            try {
                const userData = await api.getMe();
                const user = userData.data.user;

                document.getElementById('demo-balance').textContent = UIHelper.formatCurrency(user.demo_balance);
                document.getElementById('nugget-balance').textContent = UIHelper.formatCurrency(user.nugget_balance);

                const betHistory = await api.getBetHistory(50);
                const bets = betHistory.data.bets;

                document.getElementById('total-bets').textContent = bets.length;

                const totalWinnings = bets.reduce((sum, bet) => sum + (bet.payout || 0), 0);
                document.getElementById('total-winnings').textContent = UIHelper.formatCurrency(totalWinnings);

                const betHistoryEl = document.getElementById('bet-history');
                if (bets.length > 0) {
                    betHistoryEl.innerHTML = bets.map(bet => `
                        <tr>
                            <td>${UIHelper.formatDate(bet.created_at)}</td>
                            <td>${bet.game}</td>
                            <td>${UIHelper.formatCurrency(bet.stake)}</td>
                            <td>${UIHelper.formatCurrency(bet.payout || 0)}</td>
                            <td>${bet.multiplier ? bet.multiplier.toFixed(2) + 'x' : '-'}</td>
                            <td>${bet.status}</td>
                        </tr>
                    `).join('');
                } else {
                    betHistoryEl.innerHTML = '<tr><td colspan="6" style="text-align: center;">No bets yet</td></tr>';
                }

                const nuggetHistory = userData.data.nugget_history || [];
                const nuggetHistoryEl = document.getElementById('nugget-history');
                if (nuggetHistory.length > 0) {
                    nuggetHistoryEl.innerHTML = nuggetHistory.map(tx => `
                        <tr>
                            <td>${UIHelper.formatDate(tx.created_at)}</td>
                            <td>${tx.type}</td>
                            <td>${UIHelper.formatCurrency(tx.amount)}</td>
                            <td>${tx.reason}</td>
                        </tr>
                    `).join('');
                } else {
                    nuggetHistoryEl.innerHTML = '<tr><td colspan="4" style="text-align: center;">No transactions yet</td></tr>';
                }

            } catch (error) {
                UIHelper.showNotification('Failed to load dashboard: ' + error.message, 'error');
                setTimeout(() => window.location.href = '/', 2000);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
